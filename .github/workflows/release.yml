name: release

# 发版流程：先在 main 提交版本号并推送，push 触发的 tests 跑完后，在 Actions
# 页面运行本工作流并输入同一个版本号，它会：
#   1. 核对 main 的 VERSION 与输入一致、标签未被占用
#   2. 读取该提交的 tests 结果，通过才继续
#   3. 打上 v<版本号> 标签并创建 Release
#   4. 构建并推送 GHCR 多架构镜像
#   5. 构建绿色包并附加到 Release 资源

on:
  workflow_dispatch:
    inputs:
      version:
        description: 版本号，例如 0.2.0 或 0.2.0-rc.1（不要带 v 前缀）
        required: true

permissions:
  contents: read
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
    - name: Validate version
      id: version
      env:
        VERSION_INPUT: ${{ inputs.version }}
      run: |
        set -euo pipefail
        V="${VERSION_INPUT#v}"
        if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
          echo "::error::版本号格式无效: ${VERSION_INPUT}（示例: 0.2.0 或 0.2.0-rc.1）"
          exit 1
        fi
        {
          echo "value=$V"
          echo "tag=v$V"
          case "$V" in
            *-*) echo "prerelease=true" ;;
            *)   echo "prerelease=false" ;;
          esac
        } >> "$GITHUB_OUTPUT"
    - uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0
    - name: Check VERSION matches the input
      env:
        VALUE: ${{ steps.version.outputs.value }}
      run: |
        set -euo pipefail
        if [ "$(grep -c '^VERSION = "' app/wb_proxy.py)" != "1" ]; then
          echo "::error::app/wb_proxy.py 里的 VERSION 定义不是恰好一处"
          exit 1
        fi
        CURRENT="$(sed -n 's/^VERSION = "\([^"]*\)"/\1/p' app/wb_proxy.py)"
        if [ "$CURRENT" != "$VALUE" ]; then
          echo "::error::main 的 VERSION 是 $CURRENT，与 $VALUE 不一致。先提交版本号并推送，等 tests 通过后再发版"
          exit 1
        fi
    - name: Ensure the tag is free
      env:
        TAG: ${{ steps.version.outputs.tag }}
      run: |
        if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
          echo "::error::标签 $TAG 已存在，请换一个版本号"
          exit 1
        fi
    - name: Wait for the push tests
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        SHA="$(git rev-parse HEAD)"
        RUN_ID=""
        for _ in $(seq 1 30); do
          RUN_ID="$(gh run list --workflow tests.yml --commit "$SHA" --event push \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [ -n "$RUN_ID" ]; then
            break
          fi
          sleep 10
        done
        if [ -z "$RUN_ID" ]; then
          echo "::error::没有找到 $SHA 的 tests 运行记录。先推送 main，等 tests 跑完再发版"
          exit 1
        fi
        echo "核对 tests 运行 $RUN_ID（提交 $SHA）"
        gh run watch "$RUN_ID" --exit-status --interval 10
    - name: Tag and publish
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ steps.version.outputs.tag }}
        PRERELEASE: ${{ steps.version.outputs.prerelease }}
      run: |
        set -euo pipefail
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git tag -a "$TAG" -m "$TAG"
        git push origin "$TAG"
        if [ "$PRERELEASE" = "true" ]; then
          gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes --prerelease
        else
          gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
        fi

  publish-image:
    needs: release
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      tag: ${{ needs.release.outputs.tag }}

  package:
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/package.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
