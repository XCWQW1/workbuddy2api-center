# WorkBuddy2API-Center Docker Compose
# 部署：docker compose up -d
# 更新：docker compose pull && docker compose up -d
services:
  wb-proxy-center:
    # 追最新稳定版用 :latest；想固定版本可换成具体版本号（如 :0.1.2）
    image: ghcr.io/flower-elf/workbuddy2api-center:latest
    container_name: wb-proxy-center
    restart: unless-stopped
    # Defaults to root (0:0), i.e. the historical behaviour. To run as your own
    # host user instead, set PUID/PGID (e.g. PUID=$(id -u) PGID=$(id -g)
    # docker compose up -d) and make sure ./accounts and ./usage are writable
    # by that uid; see the README's Docker section.
    user: "${PUID:-0}:${PGID:-0}"
    ports:
      # 宿主机端口:容器端口（右侧必须与下面的 PORT 保持一致）
      - "8788:8788"
    environment:
      - HOST=0.0.0.0
      - PORT=8788
      # 留空则启动时自动生成 API Key，写入 ./accounts/settings.json 并打印在启动日志；想自己指定就取消下面这行注释并填上。
      # - API_KEY=your_api_key_here
      - TZ=Asia/Shanghai
    volumes:
      - ./accounts:/app/accounts
      - ./usage:/app/usage

  # 可选：Watchtower 自动静默更新服务（取消注释即可开启）
  # 每天自动检查镜像更新，拉取新版本并优雅重启 wb-proxy
  # watchtower:
  #   image: containrrr/watchtower:latest
  #   container_name: wb-proxy-watchtower
  #   restart: unless-stopped
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #   command: --interval 86400 --cleanup wb-proxy
